name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        # Only needed when we actually push; skipped for PRs.
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: simple-calendar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name sc \
            -e ICS_URL=http://127.0.0.1:9/none.ics \
            -p 5000:5000 simple-calendar:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "container healthy"
              curl -fsS http://127.0.0.1:5000/ > /dev/null && echo "index renders"
              docker exec sc whoami | grep -qx appuser && echo "not running as root"
              docker rm -f sc
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"; docker logs sc; docker rm -f sc; exit 1

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          tags: |
            ghcr.io/citytriathlon/simple-calendar:latest
            ghcr.io/citytriathlon/simple-calendar:${{ github.sha }}
            ghcr.io/citytriathlon/simple-calendar:latest-en
            ghcr.io/citytriathlon/simple-calendar:latest-ctt
